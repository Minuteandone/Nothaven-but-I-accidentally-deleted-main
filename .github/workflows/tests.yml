name: Nothaven checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_browser_smoke:
        description: Run the optional Playwright browser smoke test
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: nothaven-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-syntax:
    name: JavaScript syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run unit tests
        run: npm test

  browser-smoke:
    name: Optional Playwright smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.run_browser_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: npm run test:browser
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 1
